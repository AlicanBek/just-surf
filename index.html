<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the canvas can reach under the notch and home bar. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JUST SURF</title>

<!-- Added to the Home Screen, iOS launches this without any browser chrome,
     which is the only way to get true fullscreen on an iPhone. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Just Surf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1a2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>
  </div>

  <div id="rotate"><p>ROTATE<br>YOUR DEVICE</p></div>
  <!-- Version pinned so a cached entry module can never pair with newer HTML.
       Bump it whenever main.js changes shape. -->
  <script type="module" src="src/main.js?v=16"></script>
</body>
</html>
